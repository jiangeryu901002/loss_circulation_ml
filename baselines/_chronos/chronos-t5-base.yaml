training_data_paths:
- "./data/uniivariate_c6h3_train.arrow"
probability:
- 1.0
context_length: 32
prediction_length: 6
min_past: 0
max_steps: 2000
save_steps: 500
log_steps: 100
per_device_train_batch_size: 32
learning_rate: 0.00001
optim: adamw_torch_fused
num_samples: 20
shuffle_buffer_length: 500
gradient_accumulation_steps: 1
model_id: amazon/chronos-t5-base
model_type: seq2seq
random_init: true
tie_embeddings: true
output_dir: ./checkpoints/
tf32: true
torch_compile: false
tokenizer_class: "MeanScaleUniformBins"
tokenizer_kwargs:
  low_limit: -15.0
  high_limit: 15.0
n_tokens: 4096
lr_scheduler_type: cosine
warmup_ratio: 0.0
dataloader_num_workers: 0
max_missing_prop: 0.9
use_eos_token: true